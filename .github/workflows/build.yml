name: Build GKD Subscription
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 18 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GKD json5
        run: |
          cat > gkd.json5 <<'EOF'
{
  "name": "My GKD Rules",
  "version": "${{ github.sha }}",
  "rules": []
}
EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update GKD subscription" || echo "No changes"
          git push
